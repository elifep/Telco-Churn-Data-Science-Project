<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telco Churn Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.8);
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
            letter-spacing: -0.025em;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .form-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .form-section:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.75rem;
        }

        .section-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(79, 70, 229, 0.2);
            color: #a5b4fc;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.025em;
        }

        select,
        input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        select option {
            background: #4f46e5;
            color: white;
        }

        select:focus,
        input:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr;
            gap: 1rem;
            margin-top: 1rem;
            grid-column: 1 / -1;
        }

        @media (max-width: 600px) {
            .action-buttons {
                grid-template-columns: 1fr;
            }
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
        }

        button:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 16px;
            text-align: center;
            display: none;
            animation: slideUp 0.5s ease-out forwards;
        }

        .result-high {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--danger);
        }

        .result-low {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--success);
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .prob-bar-container {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .prob-bar {
            height: 100%;
            border-radius: 6px;
            transition: width 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loader {
            display: none;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Müşteri Kayıp Tahmini</h1>
        <p class="subtitle">Yapay zekâ destekli analizlerle müşterilerinizi elde tutun.</p>

        <form id="predictForm">
            <!-- Müşteri Bilgileri -->
            <div class="form-section">
                <h2 class="section-title">
                    <span class="section-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    Müşteri Bilgileri
                </h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Cinsiyet</label>
                        <select name="gender">
                            <option value="Female">Kadın</option>
                            <option value="Male">Erkek</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Yaşlı Vatandaş</label>
                        <select name="SeniorCitizen">
                            <option value="0">Hayır</option>
                            <option value="1">Evet</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Partner</label>
                        <select name="Partner">
                            <option value="Yes">Evet</option>
                            <option value="No">Hayır</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Bakmakla Yükümlü</label>
                        <select name="Dependents">
                            <option value="No">Hayır</option>
                            <option value="Yes">Evet</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Abonelik Süresi (Ay)</label>
                        <input type="number" name="tenure" value="12" min="0" max="100">
                    </div>
                </div>
            </div>

            <!-- Servisler -->
            <div class="form-section">
                <h2 class="section-title">
                    <span class="section-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                            <line x1="6" y1="6" x2="6.01" y2="6"></line>
                            <line x1="6" y1="18" x2="6.01" y2="18"></line>
                        </svg>
                    </span>
                    Servisler
                </h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Telefon Servisi</label>
                        <select name="PhoneService">
                            <option value="Yes">Evet</option>
                            <option value="No">Hayır</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Çoklu Hat</label>
                        <select name="MultipleLines">
                            <option value="No">Hayır</option>
                            <option value="Yes">Evet</option>
                            <option value="No phone service">Telefon Servisi Yok</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>İnternet Servisi</label>
                        <select name="InternetService">
                            <option value="Fiber optic">Fiber Optik</option>
                            <option value="DSL">DSL</option>
                            <option value="No">Hayır</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Çevrimiçi Güvenlik</label>
                        <select name="OnlineSecurity">
                            <option value="No">Hayır</option>
                            <option value="Yes">Evet</option>
                            <option value="No internet service">İnternet Servisi Yok</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Çevrimiçi Yedekleme</label>
                        <select name="OnlineBackup">
                            <option value="Yes">Evet</option>
                            <option value="No">Hayır</option>
                            <option value="No internet service">İnternet Servisi Yok</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Cihaz Koruması</label>
                        <select name="DeviceProtection">
                            <option value="No">Hayır</option>
                            <option value="Yes">Evet</option>
                            <option value="No internet service">İnternet Servisi Yok</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Teknik Destek</label>
                        <select name="TechSupport">
                            <option value="No">Hayır</option>
                            <option value="Yes">Evet</option>
                            <option value="No internet service">İnternet Servisi Yok</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>TV Yayını</label>
                        <select name="StreamingTV">
                            <option value="Yes">Evet</option>
                            <option value="No">Hayır</option>
                            <option value="No internet service">İnternet Servisi Yok</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Film Yayını</label>
                        <select name="StreamingMovies">
                            <option value="Yes">Evet</option>
                            <option value="No">Hayır</option>
                            <option value="No internet service">İnternet Servisi Yok</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Ödeme -->
            <div class="form-section">
                <h2 class="section-title">
                    <span class="section-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                            <line x1="1" y1="10" x2="23" y2="10"></line>
                        </svg>
                    </span>
                    Ödeme ve Sözleşme
                </h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Sözleşme Tipi</label>
                        <select name="Contract">
                            <option value="Month-to-month">Aydan Aya</option>
                            <option value="One year">1 Yıl</option>
                            <option value="Two year">2 Yıl</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Kağıtsız Fatura</label>
                        <select name="PaperlessBilling">
                            <option value="Yes">Evet</option>
                            <option value="No">Hayır</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ödeme Yöntemi</label>
                        <select name="PaymentMethod">
                            <option value="Electronic check">Elektronik Çek</option>
                            <option value="Mailed check">Postalanmış Çek</option>
                            <option value="Bank transfer (automatic)">Banka Transferi (Otomatik)</option>
                            <option value="Credit card (automatic)">Kredi Kartı (Otomatik)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Aylık Ücret ($)</label>
                        <input type="number" name="MonthlyCharges" value="85.5" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Toplam Ücret ($)</label>
                        <input type="number" name="TotalCharges" value="1026.0" step="0.01">
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button type="button" id="randomBtn" class="btn-secondary">Rastgele Veri</button>
                <button type="button" id="clearBtn" class="btn-secondary">Temizle</button>
                <button type="submit" id="submitBtn">
                    <span id="btnText">Tahmin Et</span>
                    <div class="loader" id="btnLoader"></div>
                </button>
            </div>
        </form>

        <div id="result">
            <div class="result-title" id="resultTitle">High Risk of Churn</div>
            <div id="resultText">The model predicts that this customer is likely to leave.</div>
            <div style="font-size: 0.9rem; margin-top: 10px; color: var(--text-muted);" id="modelInfo"></div>
            <div class="prob-bar-container">
                <div class="prob-bar" id="probBar"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('predictForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const submitBtn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');


            btnText.style.display = 'none';
            btnLoader.style.display = 'block';
            submitBtn.disabled = true;
            resultDiv.style.display = 'none';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            data.SeniorCitizen = parseInt(data.SeniorCitizen);
            data.tenure = parseInt(data.tenure);
            data.MonthlyCharges = parseFloat(data.MonthlyCharges);
            data.TotalCharges = parseFloat(data.TotalCharges);

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    const prob = (result.churn_probability * 100).toFixed(1);
                    const isChurn = result.prediction === 1;

                    document.getElementById('resultTitle').textContent = isChurn ? 'High Risk of Churn' : 'Low Risk of Churn';
                    document.getElementById('resultText').textContent = isChurn
                        ? `There is a ${prob}% probability that this customer will leave.`
                        : `This customer is likely to stay. Churn probability is ${prob}%.`;

                    document.getElementById('modelInfo').textContent = `Predicted by: ${result.model}`;

                    document.getElementById('probBar').style.width = `${prob}%`;
                    document.getElementById('probBar').style.background = isChurn ? 'var(--danger)' : 'var(--success)';

                    resultDiv.className = isChurn ? 'result-high' : 'result-low';
                    resultDiv.style.display = 'block';
                } else {
                    alert('Error: ' + result.detail);
                }
            } catch (err) {
                alert('Connection error. Is the server running?');
            } finally {
                btnText.style.display = 'block';
                btnLoader.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('predictForm').reset();
            document.getElementById('result').style.display = 'none';
        });

        document.getElementById('randomBtn').addEventListener('click', () => {
            const form = document.getElementById('predictForm');
            
            const selectRandom = (selectName) => {
                const select = form.querySelector(`select[name="${selectName}"]`);
                if (select) {
                    const options = select.options;
                    const randomIndex = Math.floor(Math.random() * options.length);
                    select.selectedIndex = randomIndex;
                }
            };

            const fields = [
                'gender', 'SeniorCitizen', 'Partner', 'Dependents', 
                'PhoneService', 'MultipleLines', 'InternetService', 
                'OnlineSecurity', 'OnlineBackup', 'DeviceProtection', 
                'TechSupport', 'StreamingTV', 'StreamingMovies', 
                'Contract', 'PaperlessBilling', 'PaymentMethod'
            ];
            
            fields.forEach(selectRandom);

            const tenure = Math.floor(Math.random() * 72) + 1;
            const monthlyCharges = (Math.random() * (118.75 - 18.25) + 18.25).toFixed(2);
            const totalCharges = (tenure * monthlyCharges).toFixed(2);

            form.querySelector('input[name="tenure"]').value = tenure;
            form.querySelector('input[name="MonthlyCharges"]').value = monthlyCharges;
            form.querySelector('input[name="TotalCharges"]').value = totalCharges;
            
            document.getElementById('result').style.display = 'none';
        });
    </script>
</body>

</html>
